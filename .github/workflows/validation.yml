name: Validate analytics pipeline

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python-validation:
    name: Python data validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate processed datasets
        run: python scripts/validate_data.py

      - name: Validate analytical metrics
        run: python scripts/validate_metrics.py

      - name: Validate Python syntax
        run: python -m compileall -q scripts src

      - name: Validate notebook JSON
        run: >-
          python -c "import json; from pathlib import Path; notebooks = sorted(Path('notebooks').glob('*.ipynb')); assert notebooks, 'No notebooks found'; [json.loads(path.read_text()) for path in notebooks]; print(f'Validated {len(notebooks)} notebooks')"

  postgres-validation:
    name: PostgreSQL analytical model validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: github
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U github -d ecommerce_analytics"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: ecommerce_analytics
      POSTGRES_USER: github
      POSTGRES_PASSWORD: postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Create PostgreSQL schema
        run: PGPASSWORD="$POSTGRES_PASSWORD" psql -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f sql/001_create_schema.sql

      - name: Load processed datasets
        run: python scripts/load_to_postgres.py

      - name: Validate PostgreSQL data
        run: python scripts/validate_postgres_data.py

      - name: Execute SQL business queries
        run: PGPASSWORD="$POSTGRES_PASSWORD" psql -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -f sql/002_business_queries.sql